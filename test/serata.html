<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Serata simulata</title>
<style>
:root{--bg:#0f1412;--panel:#18201d;--ink:#e8efe9;--muted:#93a39a;--ok:#4ade80;--ko:#f87171;--warn:#fbbf24;--line:#2a3631}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){--bg:#eef2ef;--panel:#fff;--ink:#14201b;--muted:#5b6b63;--ok:#15803d;--ko:#b91c1c;--warn:#a16207;--line:#d5ddd8}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,sans-serif}
header{position:sticky;top:0;z-index:2;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0}
button{font:inherit;padding:6px 14px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
#status{color:var(--muted)}
#opts{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#opts label{display:flex;gap:6px;align-items:center;color:var(--muted)}
#opts input{width:64px;font:inherit;padding:5px 6px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:12px;padding:12px 16px}
@media (max-width:900px){main{grid-template-columns:minmax(0,1fr)}}
#devs{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.dev{width:176px;height:340px;overflow:hidden;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.dev .lbl{font-weight:700;font-size:11px;padding:3px 8px;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dev iframe{width:390px;height:720px;border:0;transform:scale(.45);transform-origin:0 0}
#log{height:calc(100vh - 80px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font:12px/1.45 ui-monospace,Consolas,monospace}
#log .ok{color:var(--ok)} #log .ko{color:var(--ko);font-weight:700} #log .warn{color:var(--warn)} #log .h{font-weight:700;margin-top:6px}
</style>
</head>
<body>
<header><h1>Serata simulata · Ordini Oratorio</h1>
  <form id="opts">
    <label>Ordini <input type="number" name="ordini" min="10" max="600" value="100"></label>
    <label>Casse <input type="number" name="casse" min="1" max="8" value="4"></label>
    <label>Camerieri <input type="number" name="camerieri" min="1" max="28" value="21"></label>
    <label>File <input type="number" name="file" min="1" max="12" value="7"></label>
    <label title="Cambia il numero per avere una serata diversa (stessi numeri = stessa serata)">Serata n. <input type="number" name="seme" min="1" value="1"></label>
    <button id="go" type="submit">Avvia la serata</button>
  </form>
  <span id="status">Pronta. Usa solo il finto database: i dati veri non vengono toccati.</span></header>
<main><div id="devs"></div><div id="log"></div></main>
<script>
/* Serata simulata: apre tutti i "telefoni" (ognuno è l'app vera collegata al finto database)
   e li fa lavorare come in una serata vera, controllando che tutto torni.
   Parametri nell'indirizzo: ?auto=1 &ordini=200 &casse=4 &camerieri=21 &file=7 &seme=123 &step=40 */
(function(){
const P=new URLSearchParams(location.search),STEP=+P.get("step")||40,ORDERS=+P.get("ordini")||200,NCASSE=+P.get("casse")||4,NCAM=+P.get("camerieri")||21,NFILE=+P.get("file")||7;
const $devs=document.getElementById("devs"),$log=document.getElementById("log"),$st=document.getElementById("status");
const sleep=ms=>new Promise(r=>{const end=performance.now()+ms,ch=new MessageChannel();ch.port1.onmessage=()=>{performance.now()>=end?(ch.port1.close(),r()):ch.port2.postMessage(0)};ch.port2.postMessage(0)});
/* caos=1: imprevisti frequenti; caos=2 («estremo»): ancora più spesso, più cambi, più ricariche e, con l'emulatore, telefoni senza rete */
const ESTREMO=P.get("caos")==="2",CAOS=ESTREMO||P.get("caos")==="1",PR=x=>ESTREMO?Math.min(.8,x*5):CAOS?Math.min(.6,x*3):x;
let seed=+P.get("seme")||20261106;const rnd=()=>{seed=(seed*1103515245+12345)%2147483648;return seed/2147483648};
const pick=a=>a[Math.floor(rnd()*a.length)];
const R={ok:0,ko:0,checks:[],issues:[],stats:{},events:[],done:false,error:null,fase:""};window.__report=R;if(P.get("wlog"))window.__wlog=[];
function log(t,cls){const d=document.createElement("div");if(cls)d.className=cls;d.textContent=t;$log.prepend(d);R.events.push(t)}
function check(c,msg,det){c=!!c;if(c){R.ok++;R.checks.push("OK  "+msg)}else{R.ko++;R.checks.push("NO  "+msg+(det?" — "+det:""))}log((c?"✓ ":"✗ ")+msg+(!c&&det?" — "+det:""),c?"ok":"ko");return c}
function issue(m){R.issues.push(m);log("⚠ "+m,"warn")}
const F={};
function addDev(name,label){return new Promise(res=>{const w=document.createElement("div");w.className="dev";w.innerHTML=`<div class="lbl">${label}</div>`;
  const f=document.createElement("iframe");f.src=(EMU?"emu/":"")+"index.html?dev="+name+(EMU?"#k="+EMU_KEY:"");f.title=label;f.onload=()=>{try{const st=f.contentDocument.createElement("style");st.textContent="*{text-transform:none!important}";f.contentDocument.head.appendChild(st)}catch(e){}res()};w.appendChild(f);$devs.appendChild(w);F[name]=f})}
const D=n=>F[n].contentDocument,W=n=>F[n].contentWindow;
async function waitFor(fn,ms,what){const t0=performance.now();ms=ms||4000;while(performance.now()-t0<ms){try{const v=fn();if(v)return v}catch(e){}await sleep(25)}throw new Error("Tempo scaduto: "+(what||String(fn).slice(0,90)))}
const q=(n,s)=>D(n).querySelector(s),qa=(n,s)=>[...D(n).querySelectorAll(s)];
async function click(n,s){const e=typeof s==="string"?await waitFor(()=>q(n,s),3000,`[${n}] ${s}`):s;e.click();await sleep(STEP)}
async function clickText(n,s,t,starts){const e=await waitFor(()=>qa(n,s).find(b=>starts?b.textContent.trim().startsWith(t):b.textContent.trim()===t),3000,`[${n}] ${s} «${t}»`);e.click();await sleep(STEP)}
async function type(n,s,v){const e=typeof s==="string"?await waitFor(()=>q(n,s),3000,`[${n}] ${s}`):s;e.value=v;e.dispatchEvent(new Event("input",{bubbles:true}));e.dispatchEvent(new Event("change",{bubbles:true}));await sleep(STEP)}
const txt=(n,s)=>{const e=q(n,s);return e?e.innerText.replace(/\s+/g," ").trim():""};
/* ?emu=1: l'app vera collegata all'emulatore di Firebase, con le regole vere del database */
const EMU=P.get("emu")==="1",EMU_KEY="EMULATORECODICEPROVA2026",EMU_URL="http://127.0.0.1:9100/.json?ns=giovanichef-65d46-default-rtdb";
function emuReq(method,body){const x=new XMLHttpRequest();x.open(method,EMU_URL,false);x.setRequestHeader("Authorization","Bearer owner");x.send(body==null?null:JSON.stringify(body));return x.status===200?JSON.parse(x.responseText||"null"):null}
const rawDb=()=>EMU?(emuReq("GET")||{}):(JSON.parse(localStorage.getItem("mockdb")||"null")||{});
/* Firebase restituisce gli ordini numerati 1,2,3… come elenco con buchi: li rimetto come oggetto */
const unholes=x=>Array.isArray(x)?Object.fromEntries(x.map((v,i)=>[i,v]).filter(([,v])=>v!=null)):x;
const db=()=>{try{const e=rawDb().ev||{};if(e.ordini)e.ordini=unholes(e.ordini);if(e.annullati)e.annullati=unholes(e.annullati);return e}catch(e){return {}}};
const vals=x=>Object.values(x||{}).filter(Boolean);
const num=s=>Number(String(s).replace(/\./g,"").replace(",","."));
const eur=s=>{const m=String(s).match(/(\d[\d.]*,\d\d)/);return m?num(m[1]):0};
const r2=v=>Math.round(v*100)/100;
const parsePrice0=v=>{const x=parseFloat(String(v||"").replace(",","."));return isFinite(x)?x:0};
const toasts=n=>W(n).__toasts||[];
async function tab(n,role){await click(n,`#tabs button[data-role="${role}"]`)}
async function loginPin(n,nome,pin){await clickText(n,"#l-names button",nome);await type(n,"#l-pin",pin);await click(n,"#l-go");await waitFor(()=>!D(n).getElementById("who").hidden,3000,"accesso "+nome)}
async function joinW(n,code,nome){await waitFor(()=>!D(n).getElementById("v-login").hidden||!D(n).getElementById("v-join").hidden,3000,"schermata accesso "+nome);
  if(D(n).getElementById("v-join").hidden){await type(n,"#l-code",code);await click(n,"#l-code-go")}
  await clickText(n,"#j-list button",nome);await waitFor(()=>!D(n).getElementById("who").hidden,3000,"ingresso "+nome)}
const U=nome=>vals(db().config&&db().config.utenti).find(u=>u.nome===nome);
/* cassa a tasti grandi: «Aggiungi NOME» è un tasto .ctile (aria-label «Aggiungi NOME» o «Aggiungi NOME, esaurito / ne restano N / manca X»); il «−» sta nello scontrino */
const tileBtn=(n,box,name)=>qa(n,`${box} .ctile`).find(b=>{const a=b.getAttribute("aria-label");return a==="Aggiungi "+name||a.startsWith("Aggiungi "+name+", ")});
/* un piatto finito è un tasto spento per il cassiere: non si clicca, e conta come blocco per le porzioni (prima scattava a «Crea ordine») */
async function addTile(n,box,name){const b=await waitFor(()=>tileBtn(n,box,name),3000,`[${n}] tasto «${name}» in ${box}`);
  if(b.disabled){check(b.classList.contains("out")&&/esaurito/.test(b.getAttribute("aria-label")),`In cassa il tasto «${name}» esaurito è spento per il cassiere`,b.getAttribute("aria-label"));STAT.bloccatiPorzioni++;return}
  await click(n,b)}
const lines=box=>box==="#x-sing"||box==="#x-steppers"?"#x-lines":"#c-lines";
const rmBtn=(n,box,name)=>q(n,`${lines(box)} .rminus[aria-label="Togli ${name}"]`);
async function rmTile(n,box,name){await click(n,await waitFor(()=>rmBtn(n,box,name),3000,`[${n}] «Togli ${name}» nello scontrino`))}
const stepVal=(n,box,name)=>{const b=rmBtn(n,box,name);return b?+b.closest(".rline").querySelector(".rn b").textContent.replace(/\D/g,""):0};
/* apre il tastino «+ …» (note, asp, off, split) se è chiuso */
async function openMore(n,k){const b=q(n,`#c-form .cmore[data-more="${k}"]`);if(b&&b.getAttribute("aria-expanded")==="false")await click(n,b)}

/* ---------------- chi lavora stasera ---------------- */
const CASSE=Array.from({length:NCASSE},(_,i)=>({dev:"cassa"+(i+1),nome:"Cassa "+(i+1),pin:String(2001+i)}));
const NOMI=["Luca","Giulia","Paolo","Marco","Sara","Anna","Matteo","Chiara","Davide","Elena","Simone","Marta","Andrea","Sofia","Pietro","Laura","Tommaso","Irene","Giacomo","Alice","Filippo","Beatrice","Nicola","Giorgia","Stefano","Noemi","Federico","Elisa"];
const CAM=NOMI.slice(0,NCAM).map((nome,i)=>({nome,dev:"w-"+nome.toLowerCase(),fila:i%NFILE}));
const PEOPLE=[...CASSE.map(c=>[c.nome,["cassa"],c.pin]),["Capo cucina",["cucina"],"3000"],["Cuoco Primo",["cucina"],"3001",["Primo"]],
  ["Cuoco Fritto",["cucina"],"3002",["Fritto"]],["Cuoco Secondo",["cucina"],"3003",["Secondo"]],["Cuoca Dolci",["cucina"],"3004",["Dolce"]],["Uscita",["uscita"],"6000"],["Bar",["bar"],"4000"],["Capo camerieri",["capo"],"5000"]];
const COOKS=["primo","fritto","secondo","dolce"];
const COGNOMI=["Rossi","Bianchi","Esposito","Romano","Colombo","Ricci","Marino","Greco","Bruno","Gallo","Conti","De Luca","Mancini","Costa","Giordano","Rizzo","Lombardi","Moretti","Barbieri","Fontana","Santoro","Mariani","Rinaldi","Caruso","Ferrara","Galli","Martini","Leone","Longo","Gentile","Martinelli","Vitale","Lombardo","Serra","Coppola","De Santis","Marchetti","Parisi","Villa","Conte"];
let JOIN="",DOLCI=0,VINI=0,FILE_IDS=[];

/* ---------------- PREPARAZIONE ---------------- */
async function setup(){
  R.fase="preparazione";log("— Preparazione della serata —","h");
  await addDev("master","Master (Don Paolo)");
  await waitFor(()=>!D("master").getElementById("v-setup").hidden,5000,"primo avvio");
  await type("master","#s-nome","Don Paolo");await type("master","#s-pin","111111");await type("master","#s-pin2","111111");await click("master","#s-go");
  check(await waitFor(()=>!D("master").getElementById("who").hidden,3000).catch(()=>false),"Primo avvio: il master entra subito");
  await tab("master","listino");
  await waitFor(()=>db().config&&db().config.listino&&qa("master","#l-port .xedit").length===4,4000,"listino convertito (4 piatti)");
  for(const r of ["Primo","Fritto","Secondo","Dolce"]){await type("master","#l-newrep",r);await click("master","#l-addrep")}
  await waitFor(()=>vals(db().config.listino.reparti).length===6,3000,"6 reparti");
  const rid=nm=>vals(db().config.listino.reparti).find(r=>r.nome===nm).id;
  const setSel=async(sel,v)=>{const e=await waitFor(()=>q("master",sel),3000,sel);e.value=v;e.dispatchEvent(new Event("change",{bubbles:true}));await sleep(STEP*2)};
  for(const [id,nome,rep,pr,pb] of [["p-antipasto","Sciatt","Fritto","5",""],["p-primo","Pizzoccheri","Primo","7","5"],["p-secondo","Bresaola","Secondo","9",""],["p-dolce","Torta","Dolce","3",""]]){
    await type("master","#lpn-"+id,nome);await setSel("#lpr-"+id,rid(rep));await type("master","#lps-"+id,pr);if(pb)await type("master","#lpb-"+id,pb)}
  for(const [n,rep,pr] of [["Acqua","Bar","1"],["Caffè","Bar","1"],["Vino","Bar","5"],["Bibita","Bar","2"],["Patatine","Fritto","3"]]){
    await type("master","#l-newport",n);await setSel("#l-newprep",rid(rep));await type("master","#l-newpprice",pr);await click("master","#l-addport");
    await waitFor(()=>vals(db().config.listino.piatti).some(x=>x.nome===n),3000,"piatto "+n)}
  const pid=nm=>vals(db().config.listino.piatti).find(x=>x.nome===nm).id;
  await type("master","#lpm-"+pid("Acqua"),"3");
  {const id=pid("Acqua"),W_=W("master");await sleep(STEP*2);
   check(vals(db().config.listino.piatti).find(x=>x.nome==="Acqua").min===3&&W_.eval(`isLate("${id}",Date.now()-4*60000)&&!isLate("${id}",Date.now()-2*60000)&&isLate("p-primo",Date.now()-16*60000)&&!isLate("p-primo",Date.now()-14*60000)`),
     "«Pronto entro» per piatto: Acqua in ritardo dopo 3 minuti, gli altri dopo 15")}
  // menù fissi: Standard = Sciatt, Pizzoccheri, Bresaola, Torta, Acqua, Caffè; Bambini senza Bresaola e Caffè
  const mid=nm=>vals(db().config.listino.menu).find(m=>m.nome===nm).id;
  await type("master","#lmv-"+mid("Standard"),"15");await type("master","#lmv-"+mid("Bambini"),"9");
  for(const nm of ["Acqua","Caffè"])await click("master",`[data-mp="${mid("Standard")}|${pid(nm)}"]`);
  for(const nm of ["Acqua"])await click("master",`[data-mp="${mid("Bambini")}|${pid(nm)}"]`);
  await click("master",`[data-mp="${mid("Bambini")}|p-secondo"]`);
  await click("master",`[data-repbar="${rid("Bar")}"]`);await click("master",`[data-repbar="${rid("Bar")}"]`);// tolto e rimesso: resta un bar
  {const b=await waitFor(()=>q("master",`[data-delrep="${rid("Cucina")}"]`),3000);await click("master",b);await click("master",q("master",`[data-delrep="${rid("Cucina")}"]`))}
  await waitFor(()=>vals(db().config.listino.reparti).length===5,3000,"reparto Cucina tolto");
  // il Bar in fondo con ↓ (l'ordine è per reparto)
  for(let i=0;i<5;i++){const bi=vals(db().config.listino.reparti).findIndex(r=>r.nome==="Bar");if(bi>=4)break;await click("master",`[data-rdown="${bi}"]`)}
  check(vals(db().config.listino.reparti).map(r=>r.nome).join()==="Primo,Fritto,Secondo,Dolce,Bar"&&W("master").eval("S.L.piatti.map(p=>p.nome).join()")==="Pizzoccheri,Sciatt,Patatine,Bresaola,Torta,Acqua,Caffè,Vino,Bibita",
    "Ordine per reparto (↑↓ sui reparti): i piatti seguono il loro reparto",W("master").eval("S.L.piatti.map(p=>p.nome).join()"));
  {const Lx=db().config.listino,mp=nm=>vals(vals(Lx.menu).find(m=>m.nome===nm).piatti).map(id=>vals(Lx.piatti).find(x=>x.id===id).nome).sort().join(",");
   check(mp("Standard")===["Sciatt","Pizzoccheri","Bresaola","Torta","Acqua","Caffè"].sort().join()&&mp("Bambini")===["Sciatt","Pizzoccheri","Torta","Acqua"].sort().join()&&vals(Lx.menu).map(m=>m.prezzo).join()==="15,9",
     "Menù fissi: Standard (Sciatt, Pizzoccheri, Bresaola, Torta, Acqua, Caffè) 15 €, Bambini 9 €",mp("Standard")+" | "+mp("Bambini"))
   const P_=vals(Lx.piatti);check(P_.length===9&&["Acqua","Caffè","Vino","Bibita"].every(n=>P_.find(x=>x.nome===n).rep===rid("Bar"))&&P_.find(x=>x.nome==="Patatine").rep===rid("Fritto")&&vals(Lx.reparti).filter(r=>r.bar).length===1,
     "Piatti: ognuno con il suo reparto (acqua, caffè, vino al Bar; patatine al Fritto)")
   check(!db().config.menu,"La versione 36 non scrive nel listino della v35 (config/menu)")}
  // un altro primo (solo per i cambi nel menù) e le scelte dell'acqua
  await type("master","#l-newport","Pasta");await setSel("#l-newprep",rid("Primo"));await type("master","#l-newpprice","");await click("master","#l-addport");
  await waitFor(()=>vals(db().config.listino.piatti).some(x=>x.nome==="Pasta"),3000,"piatto Pasta");
  for(const v of ["Naturale","Frizzante"]){await type("master","#lpsc-"+pid("Acqua"),v);await click("master",`[data-pscadd="${pid("Acqua")}"]`);
    await waitFor(()=>vals(vals(db().config.listino.piatti).find(x=>x.nome==="Acqua").scelte).includes(v),3000,"scelta "+v)}
  await waitFor(()=>vals(vals(db().config.listino.piatti).find(x=>x.nome==="Acqua").scelte).length===2,3000,"scelte dell'acqua");
  check(vals(vals(db().config.listino.piatti).find(x=>x.nome==="Acqua").scelte).join()==="Naturale,Frizzante","Listino: l'Acqua ha le scelte Naturale e Frizzante (le decide il cameriere)");
  {// passaggio dal listino della v35: portata con due reparti, portata senza reparto, extra del bar e del Fritto
   const v35={varianti:[{id:"std",nome:"Standard",prezzo:15},{id:"bimbi",nome:"Bambini",prezzo:9}],reparti:[{id:"r1",nome:"Fritto"},{id:"r2",nome:"Secondo"}],
     portate:[{id:"antipasto",nome:"Antipasto",prezzo:4,reparti:[{r:"r1",piatto:"Sciatt"}]},{id:"secondo",nome:"Secondo",menu:["std"],reparti:[{r:"r2",piatto:"Bresaola"},{r:"r1",piatto:"Patatine"}]},{id:"dolce",nome:"Dolce",prezzo:3,colore:"#ff0000"}],
     extra:[{id:"x1",nome:"Acqua",prezzo:1,gruppo:"Bevande"},{id:"x2",nome:"Patatine extra",prezzo:3,rep:"r1"}]};
   const C=W("master").convertV35(v35),nm=id=>(C.piatti.find(x=>x.id===id)||{}).nome,rn=id=>(C.reparti.find(r=>r.id===id)||{}).nome;
   const std=C.menu.find(m=>m.id==="std").piatti.map(nm).join(","),bim=C.menu.find(m=>m.id==="bimbi").piatti.map(nm).join(",");
   const ac=C.piatti.find(x=>x.nome==="Acqua"),pe=C.piatti.find(x=>x.nome==="Patatine extra"),do_=C.piatti.find(x=>x.nome==="Dolce");
   check(std==="Sciatt,Bresaola,Patatine,Dolce"&&bim==="Sciatt,Dolce"&&rn(ac.rep)==="Bar"&&C.reparti.find(r=>r.id===ac.rep).bar&&ac.gruppo==="Bevande"&&rn(pe.rep)==="Fritto"&&rn(do_.rep)==="Cucina"&&do_.prezzo===3&&do_.colore==="#ff0000",
     "Passaggio dal listino v35: menù fatti di piatti, una portata con due reparti diventa due piatti, extra al Bar o al loro reparto",`${std} | ${bim} | ${JSON.stringify(C.reparti)}`)}
  await tab("master","persone");
  for(let i=5;i<=NFILE;i++){await type("master","#u-newfila","Fila "+i);await click("master","#u-addfila")}
  for(let i=4;i>NFILE;i--){await click("master",qa("master","#u-file [data-delfila]").pop());await click("master",qa("master","#u-file [data-delfila]").pop());await waitFor(()=>vals(db().config&&db().config.file).length===i-1,3000,"fila tolta")}
  const nf=()=>vals(db().config&&db().config.file).length||4;
  await waitFor(()=>nf()===NFILE,3000,NFILE+" file");FILE_IDS=vals(db().config.file).length?vals(db().config.file).map(f=>f.id):["f1","f2","f3","f4"];
  for(const [nome,roles,pin,reps] of PEOPLE){
    await type("master","#u-nome",nome);for(const b of qa("master","#u-ruoli button"))b.setAttribute("aria-pressed","false");
    for(const r of roles)await click("master",`#u-ruoli button[data-r="${r}"]`);
    for(const rp of reps||[])await clickText("master","#u-reps button",rp);

  check(STAT.kScParz>0&&STAT.kScParzKo===0,`Bar: pronte solo alcune scelte (es. 1 Naturale e 0 Frizzante): ${STAT.kScParz} volte la scelta tolta è rimasta da preparare`+(STAT.kScParzKo?` · ${STAT.kScParzKo} volte no`:""));
  check(STAT.uniti>0&&STAT.doppi===0,`Stesso piatto chiamato due volte mentre il primo era ancora da preparare: unito in una riga sola (${STAT.uniti} volte)`+(STAT.doppi?` · ${STAT.doppi} volte restavano due righe`:""));
  check(STAT.oAnnulla>0&&!STAT.oAnnullaKo,`Uscita: «Annulla» su un piatto pronto lo rimette da preparare (${STAT.oAnnulla} volte)`+(STAT.oAnnullaKo?` · ${STAT.oAnnullaKo} volte no`:""),STAT.oAnnullaWhy.join("; "));
  if(CAOS)check(!STAT.czKo.length&&["uncall","unserve","unready","reload","doppio","nonConsegnato"].every(k=>STAT.cz[k]>0)&&(STAT.cz.cambiModifica||0)>=(ORDERS>=100?40:1)&&(!(ESTREMO&&EMU)||STAT.cz.offline>0),`Caos: annullate ${STAT.cz.uncall} chiamate, ${STAT.cz.unserve} «Non portato», ${STAT.cz.unready} pronti annullati in cucina, ${STAT.cz.reload} telefoni ricaricati a metà serata, ${STAT.cz.doppio} doppi tocchi, ${STAT.cz.nonConsegnato} «Non consegnato» in uscita, ${STAT.cz.banco} consegne al banco, ${STAT.cz.prezzo} prezzi cambiati a serata in corso, ${STAT.cz.ingressi} chiusure degli ingressi, ${STAT.cz.cambiModifica||0} cambi aggiunti con «Modifica»${ESTREMO&&EMU?`, ${STAT.cz.offline||0} telefoni rimasti senza rete e poi tornati`:""}: tutto torna`,STAT.czKo.join(" | "));
  check(STAT.kParz>0&&!STAT.kParzKo.length,`Cucina: pronti in parte ${STAT.kParz} volte (es. 3 Pizzoccheri su 6), il resto è rimasto da preparare ed è arrivato`,STAT.kParzKo.join("; "));
  check(STAT.prontoUscita>0,`L'uscita segna «Pronto» da sola: ${STAT.prontoUscita} piatti`);
  check(STAT.aspUscita>0,"L'uscita vede anche gli asporti mandati subito in cucina");
  const nums=[...O.map(o=>o.numero),...A.map(a=>a.n)].sort((a,b)=>a-b);
  check(new Set(nums).size===nums.length&&nums.every((n,i)=>n===i+1),`Numeri da 1 a ${nums.length} senza doppioni né buchi (${A.length} annullati e bruciati)`);
  const LM=vals(E.config.listino.menu),inMenu=(pid,r)=>{const m=LM.find(x=>x.id===r.id);return !!m&&vals(m.piatti).includes(pid)};
  /* contati come la cucina: i menù meno i cambi «senza …» e «… → altro», più i cambi verso questo piatto */
  const used=pid=>O.reduce((a,o)=>a+(o.portate&&Object.keys(o.portate).some(k=>k.split("~")[0]===pid)?vals(o.righe).filter(r=>inMenu(pid,r)).reduce((s,r)=>s+r.qta,0)+vals(o.singoli).filter(s=>s.pid===pid).reduce((s,x)=>s+x.qta,0)
    -vals(o.cambi).filter(c=>c.da===pid&&c.a!==pid).reduce((s,c)=>s+c.q,0)+vals(o.cambi).filter(c=>c.a===pid&&c.da!==pid).reduce((s,c)=>s+c.q,0):0),0);
  const dolci=used("p-dolce"),vini=used(vals(E.config.listino.piatti).find(x=>x.nome==="Vino").id);
  check(dolci<=DOLCI&&vini<=VINI,`Porzioni rispettate: dolci ${dolci}/${DOLCI}, vini ${vini}/${VINI} (la cassa è stata bloccata ${STAT.bloccatiPorzioni} volte)`);
  await tab("master","evento");await sleep(STEP*4);
  const tt=txt("master","#e-times");check(/Fritto/.test(tt)&&/min/.test(tt),"Tempi della cucina calcolati per piatti e reparti",tt.slice(0,160));
  for(const c of CASSE){const id=U(c.nome).id,t=txt("master","#pn-"+id),m=t.match(/CONTANTI ([\d.,]+).*?POS ([\d.,]+)/i);
    const cc=m?num(m[1]):NaN,pp=m?num(m[2]):NaN;
    check(Math.abs(cc-L[c.dev].contanti)<0.01&&Math.abs(pp-L[c.dev].pos)<0.01,`${c.nome}: l'app dice ${cc} € contanti / ${pp} € POS, incassati davvero ${L[c.dev].contanti} / ${L[c.dev].pos}`,t)}
  for(const [i,c] of CASSE.entries()){const id=U(c.nome).id,a=r2(100+L[c.dev].contanti-(i===1&&CASSE.length>1?5:0));q("master","#pc-"+id).value=a.toFixed(2).replace(".",",");await click("master",`[data-savepost="${id}"]`)}
  await sleep(STEP*3);
  check(/tutto torna/i.test(txt("master","#pd-"+U(CASSE[0].nome).id))&&(CASSE.length<2||/Mancano ?5,00/i.test(txt("master","#pd-"+U(CASSE[1].nome).id))),"Chiusura: Cassa 1 «tutto torna», Cassa 2 «mancano 5 €»");
  await click("master","#e-export");
  const riep=Object.fromEntries((R.excel&&R.excel.riep||[]).map(r=>[r[0],r[1]]));
  const totC=r2(CASSE.reduce((a,c)=>a+L[c.dev].contanti,0)),totP=r2(CASSE.reduce((a,c)=>a+L[c.dev].pos,0));
  {const offV=r2(O.reduce((a,o)=>a+(o.offerto||0),0)),divisi=O.filter(o=>vals(o.pagamenti).filter(p=>p.m!=="offerto").length>=2);
   check(STAT.offerti>0&&offV>0&&Math.abs((riep["Pasti offerti (non incassati) €"]||0)-offV)<.01&&O.filter(o=>o.offerto>0).every(o=>o.offertoDa==="Parrocchia"&&(o.incassato||0)===0),
     `Pasti offerti: ${STAT.offerti} ordini, ${offV} € «offerti da Parrocchia», non incassati e nell'Excel`,`riep ${riep["Pasti offerti (non incassati) €"]}, ${offV}`);
   if(STAT.divisiPiatti)check(!STAT.divisiPiattiKo.length,`Conti divisi per piatti: ${STAT.divisiPiatti} ordini, la parte 1 paga esattamente il menù scelto (più l'offerta) e sul biglietto c'è cosa paga`,STAT.divisiPiattiKo.join(" | "));
   if(STAT.contiDivisi)check(divisi.length>0&&divisi.every(o=>Math.abs(vals(o.pagamenti).reduce((a,p)=>a+p.i,0)-((o.incassato||0)+(o.offerta||0)))<.01),
     `Conti divisi: ${divisi.length} ordini pagati in due parti (contanti + POS), le parti tornano con il totale`)}
  check(Math.abs((riep["di cui contanti €"]||0)-totC)<.01&&Math.abs((riep["di cui POS €"]||0)-totP)<.01,`Excel: contanti ${riep["di cui contanti €"]} € e POS ${riep["di cui POS €"]} € tornano con le casse`);
  check(R.excel&&["Tempi","Annullati","Registro modifiche"].every(f=>R.excel.fogli.includes(f))&&R.excel.tempi.length>4,"Excel: fogli Tempi, Annullati e Registro modifiche");
  R.stats={...R.stats,...STAT,ordini:O.length,annullati:A.length,dolci,vini,incassi:L,totContanti:totC,totPos:totP};
  // nuovo evento → archivio
  R.fase="archivio";const nOrd=O.length;R.excel=null;
  await type("master","#e-name","Serata simulata "+ORDERS);await click("master","#e-reset");await click("master","#e-reset-yes");
  await waitFor(()=>{const z=db();return !z.ordini&&!z.annullati&&!z.prenotazioni&&!z.log&&!(z.config&&z.config.scorte)&&vals(z.archivioIndice).length},8000,"archiviazione").catch(()=>null);
  const Z=db(),idx=vals(Z.archivioIndice)[0];
  check(!Z.ordini&&!Z.annullati&&!Z.prenotazioni&&!(Z.config.scorte)&&vals(Z.config.utenti).length>=PEOPLE.length+CAM.length&&Z.config.listino,"Nuovo evento: serata in corso svuotata, porzioni da reimpostare, persone e listino restano");
  check(idx&&idx.nome==="Serata simulata "+ORDERS&&idx.ordini===nOrd&&Math.abs(idx.contanti-totC)<.01&&Math.abs(idx.pos-totP)<.01,`Archivio: «${idx&&idx.nome}» con ${idx&&idx.ordini} ordini e gli stessi incassi`);
  await click("master","#e-arch-load");await waitFor(()=>q("master","#e-arch [data-archxl]"),3000).catch(()=>null);
  await click("master","#e-arch [data-archxl]");await waitFor(()=>R.excel,3000).catch(()=>null);
  const r2_=Object.fromEntries((R.excel&&R.excel.riep||[]).map(r=>[r[0],r[1]]));
  check(R.excel&&r2_["Ordini"]===nOrd&&Math.abs((r2_["di cui contanti €"]||0)-totC)<.01,"Dall'archivio si riscarica l'Excel della serata, con gli stessi numeri");
  await sleep(STEP*3);check(q("cassa1","#c-num").value==="1","Dopo «Nuovo evento» la cassa riparte dal numero 1",q("cassa1","#c-num").value);
}

async function run(){
  document.getElementById("go").disabled=true;const t0=performance.now();
  try{localStorage.clear();if(EMU){emuReq("PUT",{segreto:EMU_KEY});log("Emulatore di Firebase: database vuoto, regole vere","h")}
    await setup();if(EMU)await emuRuleChecks();await service();await closing();if(EMU)emuDeniedCheck()}
  catch(e){R.error=`[${R.fase}] `+String(e&&e.message||e);log("ERRORE: "+R.error+" · "+String(e&&e.stack||"").split("\n").slice(1,5).join(" ← "),"ko")}
  R.done=true;R.stats.secondi=Math.round((performance.now()-t0)/1000);
  $st.textContent=`Finita in ${R.stats.secondi}s · ${R.ok} controlli ok, ${R.ko} non ok${R.issues.length?`, ${R.issues.length} avvisi`:""}${R.error?" · ERRORE":""}`;
  log(`— Fine: ${R.ok} ok, ${R.ko} non ok —`,"h");
}
/* i campi in alto: mostrano i valori in uso; «Avvia» ricarica la pagina con quei valori e parte */
const $f=document.getElementById("opts");
["ordini","casse","camerieri","file","seme"].forEach(k=>{if(P.get(k))$f.elements[k].value=P.get(k)});
$f.addEventListener("submit",e=>{e.preventDefault();const p=new URLSearchParams();
  ["ordini","casse","camerieri","file","seme"].forEach(k=>{const el=$f.elements[k];const v=Math.max(+el.min||1,Math.min(+el.max||1e9,Math.round(+el.value||+el.min||1)));p.set(k,v)});
  ["caos","emu","step"].forEach(k=>{if(P.get(k))p.set(k,P.get(k))});p.set("auto","1");location.search=p.toString()});
if(P.get("auto")==="1")run();
})();
